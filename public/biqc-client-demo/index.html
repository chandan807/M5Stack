iv><div class="toast" id="toast">Updated</div><script>
const pages={
overview:()=>`<div class="head"><div><div class="eyebrow">Workspace overview</div><h1>Good evening, Sarah.</h1><p>One governed view of AI activity, connected systems and team access.</p></div><div><button class="btn secondary" onclick="go('architecture')">View architecture</button> <button class="btn" onclick="go('ask')">✦ Ask BIQc</button></div></div><div class="grid2"><div class="hero"><div class="live">● GOVERNANCE ENGINE · LIVE</div><h2>Your AI workforce is operating <em>inside policy.</em></h2><p>Every prompt, tool call and connected source passes identity, role and data-boundary checks before execution.</p><div class="actions"><button class="btn secondary" onclick="go('audit')">Inspect audit trail</button><button class="btn teal" onclick="go('rules')">Review data rules</button></div></div><div class="panel risk"><div class="micro">AI risk posture</div><h3 style="margin:4px 0">Controlled</h3><div class="ring"><div><b>92</b><span>Governance score</span></div></div><div class="row"><span class="badge">Healthy</span><div class="grow"><b>Policy engine</b><p>All checks active</p></div></div><div class="row"><span class="badge warn">1 warning</span><div class="grow"><b>Calendar sync</b><p>18 min since last sync</p></div></div></div></div><div class="grid4" style="margin-top:16px"><div class="panel stat"><span>Connected systems</span><b>5</b><small>Workspace-approved</small></div><div class="panel stat"><span>AI interactions today</span><b>347</b><small>+18% vs yesterday</small></div><div class="panel stat"><span>Blocked by policy</span><b>7</b><small>0 data exposures</small></div><div class="panel stat"><span>Active members</span><b>4</b><small>Across 4 roles</small></div></div><div class="grid2" style="margin-top:16px"><div class="panel list"><div class="micro">Recent governed activity</div>${activityRows()}</div><div class="panel list"><div class="micro">Connection health</div>${connectionRows(true)}</div></div>`,
ask:()=>`<div class="head"><div><div class="eyebrow">Governed assistant</div><h1>Ask BIQc</h1><p>ChatGPT-grade business AI with approved tools, policy checks and evidence.</p></div><button class="btn secondary" onclick="showModal('Model router','Switch between approved foundation models while BIQc keeps policy, tools and audit controls consistent.')">Claude 4 ▾</button></div><div class="panel chat"><div class="chatbar"><div class="micro">History</div><div class="history active">Q3 overdue invoices</div><div class="history">Pipeline risk this week</div><div class="history">Draft supplier follow-up</div><div class="history">Field team schedule</div></div><div class="chatmain"><div class="chatmsgs" id="chatmsgs"><div class="msg user"><b>You</b><p>Which overdue invoices need attention today?</p></div><div class="msg ai"><b>Ask BIQc · governed answer</b><p>I found 8 overdue invoices in Xero. Three are more than 30 days overdue and together represent $42,860. I’d prioritise Northstar Retail, Aster Projects and BluePeak Services.</p><div class="evidence">✓ Identity checked · Finance data allowed · Xero read scope · No write action executed</div></div></div><div class="composer"><input id="askInput" placeholder="Ask about your business…"><button class="btn" onclick="sendAsk()">Send</button></div></div><div class="sidepanel"><div class="micro">This conversation</div><h3>Policy context</h3><div class="permission">✓ Xero — read reports & invoices</div><div class="permission">✓ HubSpot — contacts & deals</div><div class="permission">✓ Gmail — draft only until confirmed</div><div class="permission">⊘ HR salaries — restricted for this role</div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="showModal('Tool confirmation','BIQc requests explicit confirmation before customer-impacting actions such as sending email or updating a CRM record.')">Preview tool action</button></div></div>`,
pulse:()=>simplePage('Pulse','Operational intelligence','Scheduled briefs, governance signals and workspace health in one surface.',`<div class="grid4"><div class="panel stat"><span>Policy pass rate</span><b>97.9%</b><small>Last 24 hours</small></div><div class="panel stat"><span>Median answer latency</span><b>2.1s</b><small>Across approved models</small></div><div class="panel stat"><span>Tool success rate</span><b>99.2%</b><small>After retries</small></div><div class="panel stat"><span>Estimated AI cost</span><b>$28.40</b><small>Today</small></div></div><div class="cards"><div class="panel card"><h3>Finance brief</h3><p>Cash position stable. 3 invoices crossed the 30-day threshold.</p><button class="btn secondary" onclick="demo('Finance brief opened')">Open brief</button></div><div class="panel card"><h3>People brief</h3><p>No permission anomalies. Contractor role remains tightly scoped.</p><button class="btn secondary" onclick="demo('People brief opened')">Open brief</button></div><div class="panel card"><h3>Governance brief</h3><p>7 blocked requests prevented restricted data from entering model context.</p><button class="btn secondary" onclick="demo('Governance brief opened')">Open brief</button></div></div>`),
connections:()=>simplePage('Connections','Company connections','Connect once for the workspace. Control scopes, sync health and instant revocation.',`<div class="panel list"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="micro">Workspace systems</div><button class="btn" onclick="showModal('Connect a system','OAuth connection flow would open here. Admin chooses scopes, authorises access and BIQc records the grant.')">+ Add connection</button></div>${connectionRows(false)}</div>`),
plugins:()=>simplePage('Plugins & actions','Approved AI actions','Govern exactly what Ask BIQc may do in connected systems.',`<div class="cards">${['Create HubSpot note','Draft Gmail message','Create calendar event','Update CRM deal','Generate Xero report','Trigger Zapier workflow'].map((x,i)=>`<div class="panel card"><div class="micro">${i<4?'Enabled':'Available'}</div><h3>${x}</h3><p>Scoped action with role checks, explicit confirmation where required, retries and full audit record.</p><button class="toggle ${i<4?'on':''}" onclick="this.classList.toggle('on');demo('Plugin permission updated')"><i></i></button></div>`).join('')}</div>`),
team:()=>simplePage('Team & access','People, roles and revocation','Per-user permissions with immediate access removal and traceable changes.',`<div class="panel list"><div style="text-align:right;margin-bottom:8px"><button class="btn" onclick="showModal('Invite member','Create a user, assign a governed role and apply data boundaries from their first session.')">+ Invite member</button></div>${['Sarah Chen|Admin|Now|SC','James Walker|Sales|8 min|JW','Priya Deshmukh|Finance|32 min|PD','Tom Nguyen|Contractor|2 hr|TN'].map(x=>{let a=x.split('|');return `<div class="row"><div class="appicon">${a[3]}</div><div class="grow"><b>${a[0]}</b><p>${a[1]} · Last active ${a[2]}</p></div><span class="badge">Active</span><button class="btn secondary" onclick="showModal('Manage ${a[0]}','Change role, inspect effective permissions or revoke this person’s workspace access instantly.')">Manage</button></div>`}).join('')}</div>`),
rules:()=>simplePage('Roles & data rules','Access before context','Define what each role can see and do before restricted data reaches a model.',`<div class="panel"><table class="table"><thead><tr><th>Data area</th><th>Admin</th><th>Sales</th><th>Finance</th><th>Contractor</th></tr></thead><tbody>${[['Financials',1,0,1,0],['Client personal data',1,1,0,0],['HR & salaries',1,0,1,0],['Pipeline & deals',1,1,0,0],['Email',1,1,1,0],['Calendar',1,1,0,1]].map(r=>`<tr><td><b>${r[0]}</b></td>${r.slice(1).map(v=>`<td><button class="toggle ${v?'on':''}" onclick="this.classList.toggle('on');demo('Data rule updated')"><i></i></button></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="cards"><div class="panel card"><h3>Policy tester</h3><p>Test a role and request before shipping a rule.</p><button class="btn secondary" onclick="showModal('Policy test result','Sales + “show employee salary” → BLOCKED before retrieval. Reason: HR & salaries not granted to Sales role.')">Run policy test</button></div><div class="panel card"><h3>Instant revocation</h3><p>Revoked access is enforced on the next policy evaluation.</p></div><div class="panel card"><h3>Evidence trail</h3><p>Every permission change becomes an auditable event.</p></div></div>`),
audit:()=>simplePage('Audit trail','Every AI interaction, recorded','Who asked, what sources were accessed, what action ran, and what policy decided.',`<div class="panel"><table class="table"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Resource</th><th>Result</th></tr></thead><tbody>${[['10:18:32','James Walker','Tool action','HubSpot · Draft follow-up','Confirmed'],['10:16:04','Sarah Chen','Question','Xero · overdue invoices','Allowed'],['10:13:47','Tom Nguyen','Policy check','HR & salaries','Blocked'],['10:09:11','Priya Deshmukh','Tool action','Gmail · draft supplier email','Confirmed'],['09:58:25','James Walker','Question','HubSpot · pipeline risk','Allowed'],['09:44:03','Sarah Chen','Connection','Google Calendar · reconnect','Success']].map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td><td><span class="badge ${r[4]=='Blocked'?'block':''}">${r[4]}</span></td></tr>`).join('')}</tbody></table></div><div style="margin-top:12px;text-align:right"><button class="btn secondary" onclick="exportCsv()">Export CSV</button></div>`),

architecture:()=>`<div class="head"><div><div class="eyebrow">Governed AI architecture</div><h1>Control plane before model context</h1><p>Interactive system view showing how identity, permissions, policy, models, tools and auditability fit together.</p></div></div><div class="arch"><h2>BIQc governed execution path</h2><p>Click a node to inspect its responsibility.</p><div class="nodes"><div class="line l1"></div><div class="line l2"></div><div class="line l3"></div><div class="line l4"></div><button class="node n1" onclick="showModal('Identity & RBAC','Resolve workspace, user, role and effective permissions before any business context is retrieved.')"><b>① Identity & RBAC</b><span>User · workspace · role</span></button><button class="node n2" onclick="showModal('Policy engine','Evaluates data boundaries, tool permissions and action confirmation requirements.')"><b>② Policy Engine</b><span>Allow · block · confirm</span></button><button class="node n3" onclick="showModal('Model router','Routes approved requests to OpenAI, Anthropic or another approved model while preserving governance.')"><b>③ Model Router</b><span>OpenAI · Anthropic</span></button><button class="node n4" onclick="showModal('Governed tool gateway','Executes only approved tool calls with scoped credentials, retries and sync-state awareness.')"><b>④ Tool Gateway</b><span>OAuth · webhooks · actions</span></button><button class="node n5" onclick="showModal('Audit ledger','Captures prompt metadata, policy decision, data sources, tool actions and outcome for every interaction.')"><b>⑤ Audit Ledger</b><span>Trace · evidence · export</span></button></div></div><div class="cards"><div class="panel card"><h3>Least privilege</h3><p>Connections and users receive only the scopes required for their role.</p></div><div class="panel card"><h3>Context minimisation</h3><p>Restricted data is blocked before retrieval and model-context construction.</p></div><div class="panel card"><h3>Action confirmation</h3><p>Customer-impacting writes require explicit confirmation where policy demands it.</p></div></div>`,
settings:()=>simplePage('Workspace settings','Governance defaults','Workspace identity, retention, model policy and action safeguards.',`<div class="grid2"><div class="panel list"><div class="micro">Workspace</div><div class="row"><div class="grow"><b>Northstar Ops</b><p>Australia region · Business workspace</p></div><button class="btn secondary" onclick="showModal('Workspace profile','Edit workspace name, region and organisation metadata.')">Edit</button></div><div class="row"><div class="grow"><b>Audit retention</b><p>365 days</p></div><button class="btn secondary" onclick="demo('Retention setting saved')">Change</button></div><div class="row"><div class="grow"><b>Default model policy</b><p>Approved models only</p></div><span class="badge">Enforced</span></div></div><div class="panel list"><div class="micro">Action safeguards</div>${['Require confirmation for email send','Require confirmation for CRM writes','Block restricted-data exports','Log all tool arguments'].map(x=>`<div class="row"><div class="grow"><b>${x}</b></div><button class="toggle on" onclick="this.classList.toggle('on');demo('Safeguard updated')"><i></i></button></div>`).join('')}</div></div>`)
};
function simplePage(eyebrow,title,desc,body){return `<div class="head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div></div>${body}`}
function activityRows(){return [['James Walker','HubSpot follow-up','Confirmed'],['Sarah Chen','Xero overdue invoices','Allowed'],['Tom Nguyen','HR salary request','Blocked'],['Priya Deshmukh','Gmail supplier draft','Confirmed']].map(x=>`<div class="row"><div class="appicon">${x[0].split(' ').map(y=>y[0]).join('')}</div><div class="grow"><b>${x[0]}</b><p>${x[1]}</p></div><span class="badge ${x[2]=='Blocked'?'block':''}">${x[2]}</span></div>`).join('')}
function connectionRows(short){let d=[['HubSpot','CRM','Healthy','2 min ago'],['Xero','Accounting','Healthy','5 min ago'],['Gmail','Email','Healthy','1 min ago'],['Google Calendar','Calendar','Warning','18 min ago'],['Google Drive','Files','Healthy','7 min ago']];return d.slice(0,short?4:5).map((x,i)=>`<div class="row"><div class="appicon">${x[0].slice(0,2).toUpperCase()}</div><div class="grow"><b>${x[0]}</b><p>${x[1]} · Last sync ${x[3]}</p></div><span class="badge ${x[2]=='Warning'?'warn':''}">${x[2]}</span>${short?'':`<button class="btn secondary" onclick="showModal('${x[0]} connection','Reconnect, review approved scopes, inspect sync state or revoke access immediately.')">Manage</button>`}</div>`).join('')}
const labels={overview:'Overview',ask:'Ask BIQc',pulse:'Pulse',connections:'Connections',plugins:'Plugins & actions',team:'Team & access',rules:'Roles & data rules',audit:'Audit trail',sync:'Sync health',architecture:'AI architecture',settings:'Workspace settings'};function go(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));document.getElementById('crumb').textContent=labels[id];document.getElementById('content').innerHTML=pages[id]();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));function demo(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function showModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').textContent=b;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function confirmModal(){closeModal();demo('Action confirmed in demo')}function sendAsk(){let i=document.getElementById('askInput');if(!i||!i.value.trim())return;let m=document.getElementById('chatmsgs');m.innerHTML+=`<div class="msg user"><b>You</b><p>${i.value.replace(/[<>]/g,'')}</p></div><div class="msg ai"><b>Ask BIQc · governed answer</b><p>Demo response generated after identity, role, policy and approved-source checks. No customer-impacting action was executed.</p><div class="evidence">✓ Policy checked · Approved sources only · Full audit record created</div></div>`;i.value='';m.scrollTop=m.scrollHeight;demo('Governed response generated')}function exportCsv(){let csv='time,user,action,result\n10:18:32,James Walker,Tool action,Confirmed\n10:16:04,Sarah Chen,Question,Allowed\n10:13:47,Tom Nguyen,Policy check,Blocked';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='biqc-audit-demo.csv';a.click();demo('Audit CSV exported')}document.getElementById('searchBtn').onclick=()=>showModal('Command palette','Jump to Ask BIQc, Connections, Roles & Data Rules, Audit Trail, Sync Health or Architecture. Keyboard shortcut: ⌘K.');window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('searchBtn').click()}if(e.key==='Escape')closeModal()});go('overview');
</script></body></html>
