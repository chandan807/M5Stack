</>}

function CurrentState({setToast}){return <><div className="section-title"><div><h2>Current-State Estate</h2><p>Observed infrastructure and file-service inventory. Figures are discovery-demo data.</p></div><div className="filters"><div className="inputwrap"><Search size={13}/><input placeholder="Search server or site"/></div><Button onClick={()=>setToast('Inventory CSV exported')}><Download size={13}/> CSV</Button></div></div><div className="grid4">{[['4','Primary storage platforms'],['466 TB','Raw capacity'],['1,050','Shares inventoried'],['23','DFS namespaces']].map(x=><div className="metric"><div className="metric-top"><span>{x[1]}</span><HardDrive size={15}/></div><strong>{x[0]}</strong></div>)}</div><div className="tablecard" style={{marginTop:14}}><table className="table"><thead><tr><th>System</th><th>Platform</th><th>Site</th><th>Capacity</th><th>Used</th><th>Shares</th><th>Protection</th><th>State</th></tr></thead><tbody>{systems.map(s=><tr className="clickrow" onClick={()=>setToast(`${s.name} evidence record opened`)}><td><b>{s.name}</b></td><td>{s.type}</td><td>{s.site}</td><td>{s.capacity}</td><td>{s.used}</td><td>{s.shares}</td><td>{s.prot}</td><td><Badge>{s.state}</Badge></td></tr>)}</tbody></table></div><div className="pagegrid" style={{marginTop:14}}><div className="infocard"><h3>Identity & permissions</h3><p>Two AD forests, 6,820 security groups, inherited NTFS ACL patterns and SIDHistory dependencies remain under validation.</p><Button onClick={()=>setToast('ACL analysis opened')}>Review ACL evidence</Button></div><div className="infocard"><h3>DFS & namespace</h3><p>23 namespaces across 71 folder targets. Frankfurt DFS-R backlog and legacy UNC references are active migration risks.</p><Button onClick={()=>setToast('DFS topology opened')}>View topology</Button></div><div className="infocard"><h3>Backup & DR</h3><p>Cohesity, SnapVault and Veeam policies differ across entities. Target RPO/RTO harmonisation is an open decision.</p><Button onClick={()=>setToast('Protection matrix opened')}>Protection matrix</Button></div></div></>}

function TargetArchitecture({setToast}){return <><div className="section-title"><div><h2>Target Architecture</h2><p>Recommended hybrid transition architecture — subject to evidence closure and design authority approval.</p></div><Button kind="primary" onClick={()=>setToast('Architecture review requested')}><UserRoundCheck size={14}/> Request review</Button></div><div className="card"><div className="cardhead"><div><h3>Target-state file services</h3><p>Identity-preserving migration with staged namespace cutover</p></div><Badge>Recommended</Badge></div><div className="arch"><div className="node"><Database size={18}/><b>Legacy estates</b><span>NetApp + Windows SMB</span></div><ChevronRight className="arrow"/><div className="node yellow"><RefreshCcw size={18}/><b>Migration factory</b><span>Inventory · ACL · delta copy · validation</span></div><ChevronRight className="arrow"/><div className="node yellow"><GitBranch size={18}/><b>Consolidated DFS</b><span>Stable namespace abstraction</span></div><ChevronRight className="arrow"/><div className="node"><Cloud size={18}/><b>Target storage</b><span>Hybrid SMB service tiers</span></div><ChevronRight className="arrow"/><div className="node"><ShieldCheck size={18}/><b>BCDR controls</b><span>Unified policy & recovery</span></div></div></div><div className="pagegrid" style={{marginTop:14}}>{[['Identity continuity','AD trust + SIDHistory','Preserve access during staged domain convergence'],['Namespace abstraction','DFS namespace','Decouple user paths from backend cutover'],['Migration control','Wave-based factory','Pilot → low-risk → business-critical'],['Validation','ACL + application probes','Technical and business-owner acceptance'],['Protection','Unified Cohesity policy','Target RPO/RTO aligned by tier'],['Observability','Audit + migration telemetry','Evidence for go/no-go and rollback']].map(x=><div className="infocard"><h3>{x[0]}</h3><b style={{fontSize:10}}>{x[1]}</b><p>{x[2]}</p></div>)}</div></>}

function Options({setToast}){const opts=[['A','Hybrid consolidation','Retain strategic NetApp, consolidate Windows file services, normalize DFS and protection.','8.7','€428K','24–28 wks','Recommended'],['B','Cloud-first file services','Accelerated migration to managed cloud SMB services with minimal retained on-prem.','7.2','€612K','28–34 wks','Higher change'],['C','Lift & standardize on-prem','Consolidate into a standard on-prem storage pattern before later cloud transformation.','6.8','€365K','20–24 wks','Lowest cost']];return <><div className="section-title"><div><h2>Integration Options</h2><p>Scored against risk, cost, time, operability, change impact and strategic fit.</p></div><Button onClick={()=>setToast('Scoring assumptions exported')}><Download size={13}/> Assumptions</Button></div><div className="pagegrid">{opts.map(o=><div className={'optioncard '+(o[6]==='Recommended'?'recommended':'')}>{o[6]==='Recommended'&&<div className="recommend">RECOMMENDED</div>}<div className="eyebrow" style={{color:'#9a7700'}}>OPTION {o[0]}</div><h3>{o[1]}</h3><p>{o[2]}</p><div className="score">{o[3]} <small>/ 10 weighted score</small></div><div className="pair"><span>Implementation cost</span><b>{o[4]}</b></div><div className="pair"><span>Timeline</span><b>{o[5]}</b></div><div className="pair"><span>Position</span><Badge>{o[6]}</Badge></div><Button kind={o[6]==='Recommended'?'primary':'outline'} onClick={()=>setToast(`Option ${o[0]} cost model opened`)} style={{marginTop:10}}>Open model</Button></div>)}</div><div className="card" style={{marginTop:14}}><div className="cardhead"><div><h3>Estimate confidence</h3><p>Figures shown as discovery estimates, not commitments.</p></div><Badge>Evidence linked</Badge></div><div className="cardbody"><p style={{fontSize:10,lineHeight:1.7,color:'#696960'}}>The €428K P50 estimate assumes 466 TB in scope, staged migration waves, existing licensing reuse where validated, and no major remediation beyond current risk assumptions. P80 contingency and implementation vendor quotations remain pending closure of blocking evidence.</p></div></div></>}

function Risks({setToast}){const [risks,setRisks]=useState(risksSeed);function advance(id){setRisks(risks.map(r=>r.id===id?{...r,status:r.status==='Closed'?'Open':'Closed'}:r));setToast('Risk status updated')}return <><div className="section-title"><div><h2>Risk & Dependency Register</h2><p>Prioritized items with explicit owners, dates and delivery impact.</p></div><Button kind="primary" onClick={()=>setToast('New risk form opened')}><Plus size={13}/> Add risk</Button></div><div className="riskgrid">{risks.map(r=><div className="riskcard"><div className="riskcard-top"><div><b style={{fontSize:9}}>{r.id}</b> <Badge>{r.severity}</Badge></div><button className="iconbtn" onClick={()=>advance(r.id)}><Check size={13}/></button></div><h3>{r.title}</h3><p>{r.impact}</p><div className="riskmeta"><span>Owner: <b>{r.owner}</b></span><span>Due: <b>{r.due}</b></span><span>Status: <b>{r.status}</b></span></div></div>)}</div></>}

function Deliverables({setToast}){return <><div className="section-title"><div><h2>Client Sign-off Package</h2><p>Five artefacts, each maintained as client-ready working output.</p></div><Button kind="primary" onClick={()=>setToast('All current PDFs generated')}><Download size={13}/> Generate PDFs</Button></div><div className="card"><div className="cardbody">{deliverables.map((d,i)=><div className="deliverable" style={{gridTemplateColumns:'42px 1fr 160px 90px'}}><div className="docicon"><FileText size={17}/></div><div><b>{i+1}. {d[0]}</b><small>v{['0.8','0.5','0.6','0.9','0.3'][i]} · Updated today · Evidence-linked</small></div><div><div className="progressbar"><span style={{width:d[1]}}/></div><small>{d[2]}</small></div><Button onClick={()=>setToast(`${d[0]} opened`)}><Eye size={12}/> Open</Button></div>)}</div></div></>}

function Stakeholders({setToast}){const ppl=[['Martin Keller','Head of Infrastructure','Core counterpart',82],['Sophie Braun','Identity & Security Lead','Supportive',91],['Daniel Weber','Storage Operations Manager','Cautious',64],['Elena Fischer','BCDR Lead','Engaged',88],['Lukas Meyer','Application Portfolio Lead','Needs context',58],['Nora Hoffmann','Integration Office PM','Sponsor',94]];return <><div className="section-title"><div><h2>Stakeholder Map</h2><p>Relationship context, engagement health and discovery ownership.</p></div><Button kind="primary" onClick={()=>setToast('Stakeholder added')}><Plus size={13}/> Add stakeholder</Button></div><div className="split"><div className="card"><div className="cardhead"><h3>Discovery stakeholders</h3></div><div className="cardbody">{ppl.map(p=><div className="stakeholder"><div className="avatar">{p[0].split(' ').map(x=>x[0]).join('')}</div><div><b>{p[0]}</b><small>{p[1]} · {p[2]}</small></div><div className="sentiment"><span style={{width:p[3]+'%'}}/></div><button className="iconbtn" onClick={()=>setToast(`Notes opened for ${p[0]}`)}><MoreHorizontal size={13}/></button></div>)}</div></div><div className="card"><div className="cardhead"><h3>Engagement principles</h3></div><div className="cardbody">{['Lead collaboratively, not as an outside auditor','Read back findings before recording conclusions','Separate observed fact from assumption','Surface job-security or ownership concerns carefully','Chase open items without waiting passively','Escalate blockers while continuing alternate paths'].map(x=><div className="row"><div className="leftgroup"><CheckCircle2 size={14}/><b>{x}</b></div></div>)}</div></div></div></>}

function App(){const [page,setPage]=useState('Overview');const [toast,setToast]=useState('');React.useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),2200);return()=>clearTimeout(t)},[toast]);const render=()=>({Overview:<Overview setPage={setPage} setToast={setToast}/>, 'Discovery Plan':<DiscoveryPlan setToast={setToast}/>, Workshops:<Workshops setToast={setToast}/>, 'Current State':<CurrentState setToast={setToast}/>, 'Target Architecture':<TargetArchitecture setToast={setToast}/>, 'Integration Options':<Options setToast={setToast}/>, 'Risks & Dependencies':<Risks setToast={setToast}/>, Deliverables:<Deliverables setToast={setToast}/>, Stakeholders:<Stakeholders setToast={setToast}/>}[page]);return <div className="app"><aside className="sidebar"><div className="brand"><div className="brandmark">LA</div><div><h2>Integration Office</h2><small>FILE SERVICES DISCOVERY</small></div></div><div className="nav">{nav.map(([n,I])=><button className={'navbtn '+(page===n?'active':'')} onClick={()=>setPage(n)}><I size={16}/><span>{n}</span></button>)}</div><div className="sidebar-foot"><div className="profile"><div className="avatar">JK</div><div><b>Jatin Kapoor</b><small>Principal Discovery Consultant</small></div></div></div></aside><main className="main"><Header page={page} setToast={setToast}/><div className="content">{render()}</div></main>{toast&&<div className="toast"><CheckCircle2 size={14} style={{verticalAlign:'middle',marginRight:7}}/>{toast}</div>}</div>}

createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
