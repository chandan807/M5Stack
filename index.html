<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FieldNode Prototype Lab</title>
<style>
:root{--bg:#f4f7f9;--card:#fff;--ink:#14202b;--muted:#72808b;--line:#dfe6eb;--cyan:#0ea5b7;--green:#19a66a;--amber:#d59a1d;--red:#d84a4a;--soft:#eef9fa;--shadow:0 12px 35px rgba(20,40,55,.08)}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:240px;position:fixed;inset:0 auto 0 0;background:#fbfcfd;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;z-index:10}.brand{display:flex;gap:10px;align-items:center;padding:4px 7px 18px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#e8f9fb;color:#07879a;font-weight:900}.brand b{display:block}.brand small,.muted{color:var(--muted)}nav{display:grid;gap:4px}.nav{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;color:#64717d;font-weight:700}.nav:hover,.nav.active{background:#eaf7f9;color:#087f91}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:15px 8px;font-size:11px}.main{margin-left:240px;width:calc(100% - 240px)}.top{height:72px;position:sticky;top:0;background:#f8fbfcee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;z-index:8}.topright{display:flex;gap:8px;align-items:center}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}.wrap{max-width:1600px;margin:auto;padding:26px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.heading h1{margin:0 0 6px;font-size:28px}.heading p{margin:0;color:var(--muted)}.badge{border:1px dashed #bdd2d7;border-radius:9px;padding:8px 10px;font-size:10px;color:#72838c;background:#fff}.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 15px rgba(20,40,55,.03);padding:18px}.card.click:hover{transform:translateY(-2px);border-color:#a8d6dd;box-shadow:var(--shadow)}.kicker{font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:#87939c}.title{font-size:18px;font-weight:800;margin:4px 0}.status{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900;background:#effaf4;color:#20855d}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:14px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}.metric b{display:block;font-size:18px}.metric span{font-size:10px;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:800;font-size:11px}.btn:hover{background:#f3f7f8}.btn.primary{background:#15333b;color:#fff;border-color:#15333b}.btn.danger{background:#fff1f1;color:#b43b3b;border-color:#efc8c8}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.space{justify-content:space-between}.device{height:120px;margin:15px 0;display:grid;place-items:center}.m5{width:128px;height:86px;border-radius:18px;background:#20282e;border:5px solid #161c20;padding:12px}.screen{height:48px;border-radius:8px;background:linear-gradient(145deg,#1f6671,#163f48);display:grid;place-items:center;color:#d5fbff;font-weight:900}.readings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.reading{background:#f8fafb;border:1px solid #e8eef1;border-radius:10px;padding:10px;text-align:center}.reading b{display:block}.reading small{color:var(--muted)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chip{font-size:9px;background:#f2f7f8;border:1px solid var(--line);border-radius:999px;padding:5px 7px;color:#64727c}.arch{display:grid;grid-template-columns:1fr 35px 1fr 35px 1fr 35px 1fr;align-items:center;gap:4px}.node{min-height:100px;border:1px solid var(--line);border-radius:12px;background:#f8fafb;display:grid;place-items:center;text-align:center;padding:12px}.node b{display:block}.arrow{text-align:center;color:var(--cyan);font-size:22px}.activity{display:grid;gap:9px}.activity div{padding-bottom:9px;border-bottom:1px solid #edf1f3;color:#61717d;font-size:11px}.activity div:before{content:'•';color:var(--cyan);margin-right:7px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.tabs{display:flex;gap:6px}.tabs button.active{background:#15333b;color:white}.chart{height:260px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#fff,#fbfdfe);padding:18px;position:relative;overflow:hidden}.chart svg{width:100%;height:100%}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf1f3;text-align:left;font-size:11px}.table th{color:#7d8992}.control{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.power{width:140px;height:140px;border-radius:50%;margin:15px auto;border:10px solid #dfe8eb;background:#eef9f3;display:grid;place-items:center;font-size:24px;font-weight:900;color:#20845c}.power.off{background:#f5f6f7;color:#7e8a92}.seg{display:flex;background:#f0f4f5;padding:4px;border-radius:10px}.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;font-weight:800}.seg button.active{background:#fff;box-shadow:0 2px 8px #ccd7da}.phone{width:270px;height:520px;border:9px solid #20262b;border-radius:38px;background:#f8fafb;margin:auto;overflow:hidden;box-shadow:0 20px 45px rgba(20,30,40,.17)}.phoneHead{height:34px;background:#fff;display:grid;place-items:center;font-size:9px}.phoneBody{padding:16px;height:430px;overflow:auto}.phoneNav{height:56px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.phoneNav button{border:0;background:transparent;font-size:9px}.phoneNav button.active{color:var(--cyan);font-weight:900}.mobileCard{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;background:#fff}.pair{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}.radar{width:160px;height:160px;border:1px solid #b9dfe5;border-radius:50%;margin:15px auto;display:grid;place-items:center;background:radial-gradient(circle,#e7f9fb 0 20%,transparent 21% 40%,#eff9fa 41% 42%,transparent 43%)}.steps{display:flex;gap:8px}.step{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:10px}.step.active{background:var(--cyan);color:#fff}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.config{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}.editor{width:100%;min-height:430px;background:#172128;color:#d7eef1;border:0;border-radius:12px;padding:16px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}.progress{height:7px;border-radius:99px;background:#e9eff1;overflow:hidden}.progress span{display:block;height:100%;background:var(--cyan);width:0}.rfhero{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:16px;align-items:center;text-align:center}.radio{height:4px;background:#d9e7e9;position:relative}.packet{width:14px;height:14px;background:var(--cyan);border-radius:50%;position:absolute;top:-5px;left:5%;transition:.55s}.bomItem,.testItem,.delivery{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}.bomItem:hover,.testItem:hover,.delivery:hover{border-color:#9fd2d9}.selected{outline:2px solid #b5e0e5}.tests{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pass{color:var(--green);font-weight:900}.progressing{color:var(--amber);font-weight:900}.toast{position:fixed;right:22px;bottom:22px;background:#162a31;color:white;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}.modal{position:fixed;inset:0;background:#14202b77;z-index:40;display:grid;place-items:center;padding:20px}.modalBox{max-width:560px;width:100%;background:#fff;border-radius:16px;padding:20px}.hidden{display:none}@media(max-width:1000px){.side{transform:translateX(-100%)}.main{margin-left:0;width:100%}.g3,.g4{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr 1fr}.control,.config,.pair{grid-template-columns:1fr}.arch{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.rfhero{grid-template-columns:1fr}.wrap{padding:18px}}@media(max-width:620px){.g3,.g4,.g2,.metrics,.tests{grid-template-columns:1fr}.topright .pill{display:none}.heading{display:block}.badge{display:inline-block;margin-top:10px}.wrap{padding:14px}.phone{width:260px}.arch .arrow{display:block}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">FN</div><div><b>FieldNode</b><small>Prototype Lab</small></div></div><nav id="nav"></nav><div class="sidefoot"><b>Engineering Demo</b><br><span class="muted">M5Stack / ESP32 • v1.2</span></div></aside><main class="main"><header class="top"><div><div class="kicker">FieldNode</div><b id="topTitle">Prototype Control Center</b></div><div class="topright"><div class="pill"><span class="dot"></span>3 Devices Online</div><div class="pill">Gateway Connected</div><button class="btn" data-action="heartbeat">Heartbeat</button></div></header><div id="page" class="wrap"></div></main></div><div id="toast" class="toast"></div><div id="modal" class="hidden"></div>
<script>
const routes=[['overview','Overview'],['prototypes','Prototypes'],['telemetry','Live Telemetry'],['controls','Controls'],['mobile','Mobile App'],['pairing','Device Pairing'],['configuration','Configuration'],['lora','LoRa Link'],['hardware','Hardware / BOM'],['validation','Validation'],['delivery','Delivery Flow']];
const S={route:'overview',selected:'env',telemetryRange:'1H',telemetryDevice:'ENV-01',paused:false,pump:true,mode:'Manual',threshold:28,pair:1,mobile:'home',mobileDevice:'ENV-01',config:'VALID',upload:0,packet:12486,packetPos:5,freq:'915 MHz',sf:'SF9',bw:'125 kHz',bom:'ENV-01',test:'Wi-Fi Recovery',step:1,activity:['ENV-01 telemetry received','FIELD-03 LoRa packet received','CTRL-02 output changed to ON','Gateway heartbeat received']};
let telemetry=[['17:16:02',23.4,46.8,1008.0,82,-54],['17:16:07',23.5,46.7,1008.1,82,-55],['17:16:12',23.5,46.5,1008.2,82,-54],['17:16:17',23.6,46.4,1008.3,82,-56],['17:16:22',23.7,46.2,1008.4,82,-54]];
const yaml=`esphome:\n  name: env-01\n  friendly_name: ENV-01\n\nesp32:\n  board: esp32-s3-devkitc-1\n\nwifi:\n  ssid: !secret wifi_ssid\n  password: !secret wifi_password\n\ni2c:\n  scan: true\n\nsensor:\n  - platform: sht3xd\n    temperature:\n      name: \"ENV-01 Temperature\"\n    humidity:\n      name: \"ENV-01 Humidity\"\n    address: 0x44\n    update_interval: 5s\n\nlogger:\napi:\nota:`;let yamlText=yaml;
function nav(){document.querySelector('#nav').innerHTML=routes.map(([r,n])=>`<button class="nav ${S.route===r?'active':''}" data-route="${r}">${n}</button>`).join('')}
function head(title,sub){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div><div class="badge">Interactive prototype concept • simulated telemetry</div></div>`}
function toast(m){const t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function modal(title,body){const m=document.querySelector('#modal');m.className='modal';m.innerHTML=`<div class="modalBox"><div class="row space"><h2>${title}</h2><button class="btn" data-action="close">Close</button></div>${body}</div>`}
function deviceCard(id,name,type,readings,chips){return `<div class="card click" data-action="prototype" data-id="${id}"><div class="row space"><div><div class="kicker">${name}</div><div class="title">${type}</div></div><span class="status">● ONLINE</span></div><div class="device"><div class="m5"><div class="screen">${name}</div></div></div><div class="readings">${readings.map(x=>`<div class="reading"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div><div class="chips">${chips.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>`}
function overview(){return head('M5Stack Sensor & Control Prototype System','Modular ESP32 architecture using off-the-shelf hardware wherever practical.')+`<div class="grid g2"><div class="card"><div class="kicker">System Architecture</div><div class="arch"><div class="node"><div><b>Sensors</b><small>ENV / Inputs</small></div></div><div class="arrow">→</div><div class="node"><div><b>ESP32 / M5Stack</b><small>Local processing</small></div></div><div class="arrow">→</div><div class="node"><div><b>Wi-Fi • BLE • LoRa</b><small>Wireless layer</small></div></div><div class="arrow">→</div><div class="node"><div><b>Phone / Gateway</b><small>Monitor + control</small></div></div></div></div><div class="card"><div class="row space"><b>Live Activity</b><button class="btn" data-action="refresh">Refresh</button></div><div class="activity">${S.activity.slice(0,5).map(a=>`<div>${a}</div>`).join('')}</div></div></div><div class="grid g3" style="margin-top:14px">${deviceCard('env','ENV-01','Environmental Sensor',[['23.7 °C','Temperature'],['46.2 %','Humidity'],['82%','Battery']],['ESP32-S3','I²C','Wi-Fi','BLE'])}${deviceCard('ctrl','CTRL-02','Portable Control Node',[[S.pump?'ON':'OFF','12V Pump'],['0.38 A','Current'],['76%','Battery']],['ESP32','GPIO','PWM','BLE'])}${deviceCard('field','FIELD-03','Long-Range LoRa Node',[['2.4 km','Distance'],['-112 dBm','RSSI'],['99.4%','Delivery']],['SX1262','LoRa','SPI','Battery'])}</div><div class="metrics"><div class="metric"><b>3 / 3</b><span>Devices Online</span></div><div class="metric"><b>99.4%</b><span>Packet Delivery</span></div><div class="metric"><b>74%</b><span>Average Battery</span></div><div class="metric"><b>42 ms</b><span>Local Response</span></div><div class="metric"><b>24 h</b><span>Prototype Test</span></div></div><div class="card row space"><div><div class="kicker">Prototype-first engineering</div><h2>2–3 modular devices. Working mobile control. Measured validation.</h2></div><div class="row"><button class="btn primary" data-route="prototypes">View Builds</button><button class="btn" data-route="mobile">Open Mobile Demo</button></div></div>`}
const proto={env:{name:'ENV-01',type:'Environmental Sensor',parts:['M5Stack CoreS3 / ESP32-S3','ENV temperature / humidity / pressure','Rechargeable portable battery','Compact printed enclosure'],fw:'ESPHome + small custom component'},ctrl:{name:'CTRL-02',type:'Portable Control Node',parts:['ESP32 controller','Protected output stage','Relay / MOSFET interface','12 V controlled load'],fw:'ESPHome YAML + safety C++'},field:{name:'FIELD-03',type:'Long-Range LoRa Node',parts:['ESP32 controller','SX1262 LoRa radio','External matched antenna','Battery + portable enclosure'],fw:'Arduino / ESPHome-compatible'}};
function prototypes(){const p=proto[S.selected];return head('Prototype Builds','Select each prototype and inspect the assembly, interfaces, firmware and validation plan.')+`<div class="row" style="margin-bottom:14px">${Object.entries(proto).map(([k,v])=>`<button class="btn ${S.selected===k?'primary':''}" data-action="selectProto" data-id="${k}">${v.name}</button>`).join('')}</div><div class="grid g2"><div class="card"><div class="kicker">Selected Prototype</div><h2>${p.name} — ${p.type}</h2><div class="device"><div class="m5"><div class="screen">${p.name}</div></div></div><div class="row space"><span class="status">ASSEMBLED</span><button class="btn primary" data-action="bench">Run Bench Test</button></div></div><div class="card"><div class="kicker">Exploded Assembly</div>${p.parts.map((x,i)=>`<button class="card click" style="width:100%;margin:8px 0;text-align:left" data-action="part" data-part="${x}"><b>0${i+1}</b> &nbsp; ${x}</button>`).join('')}<div class="card" style="margin-top:10px"><b>Firmware</b><p class="muted">${p.fw}</p></div></div></div>`}
function lineSvg(vals){let min=Math.min(...vals)-.2,max=Math.max(...vals)+.2;let pts=vals.map((v,i)=>`${i/(vals.length-1)*100},${92-(v-min)/(max-min)*75}`).join(' ');return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#0ea5b7" stroke-width="2" vector-effect="non-scaling-stroke"/><line x1="0" y1="92" x2="100" y2="92" stroke="#dfe6eb"/></svg>`}
function telemetryPage(){let rows=telemetry.slice(-5).reverse();return head('Live Telemetry','Simulated streaming data to demonstrate how sensor monitoring would behave.')+`<div class="card"><div class="toolbar"><div class="row"><select id="teleDevice"><option>ENV-01</option><option>CTRL-02</option><option>FIELD-03</option></select><span class="status">● ${S.paused?'PAUSED':'STREAMING'}</span></div><div class="row"><div class="tabs">${['1H','6H','24H'].map(r=>`<button class="btn ${S.telemetryRange===r?'active':''}" data-action="range" data-range="${r}">${r}</button>`).join('')}</div><button class="btn" data-action="pause">${S.paused?'Resume':'Pause'}</button><button class="btn" data-action="csv">Export CSV</button></div></div><div class="chart">${lineSvg(telemetry.map(x=>x[1]))}</div><div class="metrics"><div class="metric"><b>${telemetry.at(-1)[1]}°C</b><span>Temperature</span></div><div class="metric"><b>${telemetry.at(-1)[2]}%</b><span>Humidity</span></div><div class="metric"><b>${telemetry.at(-1)[3]}</b><span>hPa</span></div><div class="metric"><b>${telemetry.at(-1)[4]}%</b><span>Battery</span></div><div class="metric"><b>${telemetry.at(-1)[5]} dBm</b><span>RSSI</span></div></div><table class="table"><thead><tr><th>Time</th><th>Temp</th><th>Humidity</th><th>Pressure</th><th>Battery</th><th>RSSI</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td>${x}${i===1?'°C':i===2||i===4?'%':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function controls(){return head('Remote Control','Interactive CTRL-02 control and local fail-safe behavior.')+`<div class="control"><div class="card"><div class="row space"><div><div class="kicker">CTRL-02</div><h2>12V Pump</h2></div><span class="status">● ONLINE</span></div><button class="power ${S.pump?'':'off'}" data-action="pump">${S.pump?'ON':'OFF'}</button><div class="readings"><div class="reading"><b>${S.pump?'0.38':'0.00'} A</b><small>Current</small></div><div class="reading"><b>12.1 V</b><small>Supply</small></div><div class="reading"><b>${S.pump?'18:42':'00:00'}</b><small>Runtime</small></div></div><button class="btn danger" style="width:100%;margin-top:12px" data-action="stop">STOP OUTPUT</button></div><div class="grid"><div class="card"><b>Mode</b><div class="seg" style="margin-top:10px"><button class="${S.mode==='Manual'?'active':''}" data-action="mode" data-mode="Manual">Manual</button><button class="${S.mode==='Automatic'?'active':''}" data-action="mode" data-mode="Automatic">Automatic</button></div></div><div class="card"><b>Automatic Rule</b><p>IF Temperature &gt; <input id="threshold" type="number" value="${S.threshold}" style="width:70px"> °C THEN Output 1 ON</p><button class="btn primary" data-action="simulate">Simulate 29.2°C</button></div><div class="card"><b>Fail-safe behavior</b><p class="muted">Loss of network: maintain safe local state<br>Max continuous runtime: 30 min<br>Reconnect: restore latest valid configuration</p></div></div></div>`}
function phoneMarkup(){let body='';if(S.mobile==='home')body=`<div class="kicker">FieldNode</div><h2>Good afternoon</h2><p class="muted">3 devices</p>${[['ENV-01','23.7°C • 46%'],['CTRL-02',S.pump?'Pump ON':'Pump OFF'],['FIELD-03','LoRa Link • 2.4 km']].map(d=>`<button class="mobileCard" style="width:100%;text-align:left" data-action="mobileDevice" data-device="${d[0]}"><b>${d[0]}</b><br><small>${d[1]} • Online</small></button>`).join('')}`;if(S.mobile==='device')body=`<button class="btn" data-action="mobileHome">← Home</button><h2>${S.mobileDevice}</h2>${S.mobileDevice==='CTRL-02'?`<div class="power ${S.pump?'':'off'}" style="width:110px;height:110px" data-action="pump">${S.pump?'ON':'OFF'}</div><p style="text-align:center">Current ${S.pump?'0.38':'0.00'} A</p>`:`<div class="readings"><div class="reading"><b>23.7°</b><small>Temp</small></div><div class="reading"><b>46.2%</b><small>Humidity</small></div><div class="reading"><b>82%</b><small>Battery</small></div></div><div class="chart" style="height:130px;margin-top:12px">${lineSvg(telemetry.map(x=>x[1]))}</div>`}`;if(S.mobile==='alerts')body=`<h2>Alerts</h2><button class="mobileCard" data-action="ack" style="width:100%;text-align:left"><b>LoRa link recovered</b><br><small>FIELD-03 • 8 min ago</small></button><button class="mobileCard" data-action="ack" style="width:100%;text-align:left"><b>Battery 71%</b><br><small>FIELD-03 • 22 min ago</small></button>`;if(S.mobile==='settings')body=`<h2>Settings</h2>${['BLE provisioning','Wi-Fi network','Notifications','Firmware updates'].map(x=>`<button class="mobileCard" data-action="setting" style="width:100%;text-align:left">${x}</button>`).join('')}`;return `<div class="phone"><div class="phoneHead">9:41 • FieldNode</div><div class="phoneBody">${body}</div><div class="phoneNav">${['home','device','alerts','settings'].map(x=>`<button data-action="mobileNav" data-screen="${x}" class="${S.mobile===x?'active':''}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div>`}
function mobile(){return head('Basic Phone App','Interactive mobile concept for pairing, monitoring, controls and alerts.')+`<div class="grid g2"><div>${phoneMarkup()}</div><div class="card"><div class="kicker">Try the demo</div><h2>Clickable mobile flow</h2><p class="muted">Open devices, control CTRL-02, browse alerts and settings, then use the pairing page to simulate onboarding.</p><div class="grid"><button class="btn" data-action="mobileQuick" data-screen="home">Home</button><button class="btn" data-action="mobileQuick" data-screen="device">Device</button><button class="btn" data-action="mobileQuick" data-screen="alerts">Alerts</button><button class="btn primary" data-route="pairing">Open Pairing Flow</button></div></div></div>`}
function pairing(){let body=S.pair===1?`<div class="radar"><b>BLE</b></div><div class="card"><b>ENV-01</b><p class="muted">M5Stack ESP32 • -48 dBm</p><button class="btn primary" data-action="pairNext">Connect</button></div>`:S.pair===2?`<div class="field"><label>Wi-Fi network</label><input id="wifi" value="Workshop_2G"></div><div class="field"><label>Password</label><input type="password" value="prototype123"></div><div class="row"><button class="btn" data-action="pairBack">Back</button><button class="btn primary" data-action="pairNext">Save & Connect</button></div>`:`<div style="text-align:center;padding:25px"><div style="font-size:50px;color:var(--green)">✓</div><h2>ENV-01 connected</h2><p class="muted">Temperature ✓<br>Humidity ✓<br>Pressure ✓<br>Cloud connection ✓</p><button class="btn primary" data-action="pairOpen">Open Device</button><button class="btn" data-action="pairReset">Restart</button></div>`;return head('Device Pairing','Three-step BLE and Wi-Fi onboarding simulation.')+`<div class="pair"><div>${phoneMarkup()}</div><div class="card"><div class="steps">${[1,2,3].map(x=>`<div class="step ${S.pair>=x?'active':''}">${x}</div>`).join('')}</div><h2>${S.pair===1?'Add Device':S.pair===2?'Configure Wi-Fi':'Device Ready'}</h2>${body}</div></div>`}
function configuration(){return head('Low-Code Configuration','ESPHome-first approach with custom C++ only where necessary.')+`<div class="config"><div class="card"><div class="field"><label>Device</label><input value="ENV-01" disabled></div><div class="field"><label>Board</label><input value="ESP32-S3" disabled></div><label><input type="checkbox" checked> Temperature</label><br><label><input type="checkbox" checked> Humidity</label><br><label><input type="checkbox" checked> Pressure</label><br><label><input type="checkbox" checked> BLE Provisioning</label><div style="margin-top:15px" class="row"><button class="btn" data-action="preset">Low-power preset</button></div><p class="muted">Custom C++ reserved for hardware behavior not cleanly handled by configuration.</p></div><div class="card"><div class="row space"><b>ENV-01 YAML</b><span class="status" id="configStatus">${S.config}</span></div><textarea id="yaml" class="editor">${yamlText}</textarea><div class="progress"><span id="prog" style="width:${S.upload}%"></span></div><div class="row" style="margin-top:10px"><button class="btn" data-action="validate">Validate</button><button class="btn" data-action="compile">Compile</button><button class="btn primary" data-action="upload">Upload</button><button class="btn" data-action="copy">Copy YAML</button></div></div></div>`}
function lora(){return head('Long-Range Wireless Link','Interactive RF test page for FIELD-03 and Gateway-01.')+`<div class="card"><div class="toolbar"><div class="row"><select id="freq"><option ${S.freq==='868 MHz'?'selected':''}>868 MHz</option><option ${S.freq==='915 MHz'?'selected':''}>915 MHz</option></select><select id="sf">${['SF7','SF8','SF9','SF10','SF11','SF12'].map(x=>`<option ${S.sf===x?'selected':''}>${x}</option>`).join('')}</select><select id="bw"><option>125 kHz</option><option>250 kHz</option></select></div><div class="row"><button class="btn primary" data-action="packet">Send Test Packet</button><button class="btn" data-action="rangeTest">Extend Range Test</button></div></div><div class="rfhero"><div class="node"><b>FIELD-03</b><small>LoRa Node</small></div><div><b>2.4 km</b><div class="radio"><span class="packet" id="packet" style="left:${S.packetPos}%"></span></div><small>Packet #${S.packet}</small></div><div class="node"><b>Gateway-01</b><small>ACK target</small></div></div><div class="metrics"><div class="metric"><b>-112 dBm</b><span>RSSI</span></div><div class="metric"><b>+8.6 dB</b><span>SNR</span></div><div class="metric"><b>0.6%</b><span>Packet loss</span></div><div class="metric"><b>12,486</b><span>Packets</span></div><div class="metric"><b>5 sec</b><span>Last RX</span></div></div></div>`}
const boms={"ENV-01":[['Controller','M5Stack ESP32-S3 controller'],['Sensor','ENV temp / humidity / pressure'],['Power','Rechargeable Li-ion/LiPo'],['Connection','Grove / I²C'],['Enclosure','Compact printed housing']],"CTRL-02":[['Controller','ESP32 module'],['Output','Protected relay / MOSFET'],['Power','Portable rechargeable source'],['Load','Locking / screw terminal'],['Enclosure','Prototype shell']],"FIELD-03":[['Controller','ESP32'],['Radio','SX1262 LoRa'],['Antenna','External matched antenna'],['Sensor','Grove / I²C input'],['Power','Rechargeable battery']]};
function hardware(){return head('Prototype Hardware','Off-the-shelf first: approximately 90% standard modules, 10% custom integration.')+`<div class="row" style="margin-bottom:12px">${Object.keys(boms).map(x=>`<button class="btn ${S.bom===x?'primary':''}" data-action="bomSelect" data-bom="${x}">${x}</button>`).join('')}<button class="btn" data-action="bomCsv">Export BOM CSV</button></div><div class="card"><h2>${S.bom}</h2><div class="grid g2">${boms[S.bom].map(x=>`<button class="bomItem" style="text-align:left" data-action="bomItem" data-name="${x[0]}" data-value="${x[1]}"><div class="kicker">${x[0]}</div><b>${x[1]}</b></button>`).join('')}</div></div>`}
const tests=[['Sensor Detection','PASS'],['8-Hour Runtime','PASS'],['BLE Provisioning','PASS'],['Wi-Fi Reconnect','PASS'],['Remote Output','PASS'],['Local Fail-Safe','PASS'],['OTA Update','PASS'],['Power Cycle Recovery','PASS'],['Data Logging','PASS'],['Mobile Pairing','PASS'],['500 m RF Test','PASS'],['Extended LoRa Range','IN PROGRESS'],['Final Enclosure Fit','IN PROGRESS']];
function validation(){return head('Prototype Validation','Engineering-style verification with clickable test details and rerun actions.')+`<div class="grid g2"><div class="card"><div class="metrics" style="grid-template-columns:1fr 1fr"><div class="metric"><b>18 / 20</b><span>Tests Passed</span></div><div class="metric"><b>2</b><span>In Progress</span></div></div><div class="tests">${tests.map(t=>`<button class="testItem ${S.test===t[0]?'selected':''}" style="text-align:left" data-action="test" data-test="${t[0]}"><b>${t[0]}</b><br><span class="${t[1]==='PASS'?'pass':'progressing'}">${t[1]}</span></button>`).join('')}</div></div><div class="card"><div class="kicker">Selected Test</div><h2>${S.test}</h2><p class="muted">Network disconnected: 14:02:11<br>Local operation: Maintained<br>Network restored: 14:03:08<br>Reconnect: 3.2 sec<br>Telemetry restored: Yes</p><div class="status">PASS</div><div style="margin-top:15px"><button class="btn primary" data-action="rerun">Rerun Test</button><button class="btn" data-action="runAll">Run Quick Suite</button></div></div></div>`}
const steps=[['Requirements','Sensors • control behavior • RF range • power target'],['Module Selection','M5Stack • ESP32 • sensors • radio'],['Bench Prototype','Wire • configure • firmware'],['Phone App','Pair • monitor • control'],['Validation','Power • wireless • sensors • recovery'],['Deliver','2–3 tested units • source • build notes']];
function delivery(){return head('Prototype Delivery','A simple client-readable path from requirements to tested units.')+`<div class="grid g3">${steps.map((x,i)=>`<button class="delivery ${S.step===i+1?'selected':''}" style="text-align:left" data-action="delivery" data-step="${i+1}"><div class="kicker">0${i+1}</div><h3>${x[0]}</h3><p class="muted">${x[1]}</p></button>`).join('')}</div><div class="card row space" style="margin-top:14px"><div><div class="kicker">Current stage</div><h2>${steps[S.step-1][0]}</h2><p class="muted">${steps[S.step-1][1]}</p></div><button class="btn primary" data-action="nextStep">Next Stage →</button></div><div class="metrics"><div class="metric"><b>2–3</b><span>Physical Prototypes</span></div><div class="metric"><b>1</b><span>Basic Phone App</span></div><div class="metric"><b>100%</b><span>Source / YAML</span></div><div class="metric"><b>1</b><span>Test Report</span></div></div>`}
function render(){nav();document.querySelector('#topTitle').textContent=routes.find(x=>x[0]===S.route)[1];let fn={overview,prototypes,telemetry:telemetryPage,controls,mobile,pairing,configuration,lora,hardware,validation,delivery}[S.route];document.querySelector('#page').innerHTML=fn()}
function download(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
document.addEventListener('click',e=>{let r=e.target.closest('[data-route]');if(r){S.route=r.dataset.route;render();scrollTo(0,0);return}let a=e.target.closest('[data-action]');if(!a)return;let x=a.dataset.action;if(x==='close'){document.querySelector('#modal').className='hidden';return}if(x==='heartbeat'){S.activity.unshift('Gateway heartbeat acknowledged');toast('Gateway ACK: 38 ms')}if(x==='refresh'){S.activity.unshift('Dashboard manually refreshed');render();toast('Activity refreshed')}if(x==='prototype'){S.selected=a.dataset.id;S.route='prototypes';render()}if(x==='selectProto'){S.selected=a.dataset.id;render()}if(x==='bench'){toast(`${proto[S.selected].name} bench test passed`);S.activity.unshift(`${proto[S.selected].name} bench test passed`)}if(x==='part')modal(a.dataset.part,`<p>Standard module selected for fast prototype assembly. Final part number and mechanical fit are confirmed during bench integration.</p>`);if(x==='range'){S.telemetryRange=a.dataset.range;render()}if(x==='pause'){S.paused=!S.paused;render();toast(S.paused?'Telemetry paused':'Telemetry resumed')}if(x==='csv')download('telemetry.csv','time,temp,humidity,pressure,battery,rssi\n'+telemetry.map(r=>r.join(',')).join('\n'));if(x==='pump'){S.pump=!S.pump;S.activity.unshift(`CTRL-02 output changed to ${S.pump?'ON':'OFF'}`);render();toast(`Pump ${S.pump?'ON':'OFF'}`)}if(x==='stop'){S.pump=false;render();toast('Output stopped')}if(x==='mode'){S.mode=a.dataset.mode;render()}if(x==='simulate'){S.mode='Automatic';S.pump=29.2>S.threshold;render();toast(S.pump?'Rule triggered — output ON':'Rule not triggered')}if(x==='mobileNav'||x==='mobileQuick'){S.mobile=a.dataset.screen;if(S.mobile==='device')S.mobileDevice=S.mobileDevice||'ENV-01';render()}if(x==='mobileDevice'){S.mobileDevice=a.dataset.device;S.mobile='device';render()}if(x==='mobileHome'){S.mobile='home';render()}if(x==='ack')toast('Alert acknowledged');if(x==='setting')toast('Setting opened in demo mode');if(x==='pairNext'){if(S.pair===2&&!document.querySelector('#wifi').value.trim()){toast('Enter Wi-Fi network');return}S.pair=Math.min(3,S.pair+1);render();toast(S.pair===3?'Device connected':'BLE connected')}if(x==='pairBack'){S.pair=Math.max(1,S.pair-1);render()}if(x==='pairReset'){S.pair=1;render()}if(x==='pairOpen'){S.mobile='device';S.mobileDevice='ENV-01';S.route='mobile';render()}if(x==='preset'){yamlText=yamlText.replace('update_interval: 5s','update_interval: 30s');S.config='MODIFIED';render();toast('Low-power preset loaded')}if(x==='validate'){yamlText=document.querySelector('#yaml').value;S.config=yamlText.includes('esphome:')&&yamlText.includes('esp32:')?'VALID':'ERROR';render();toast(S.config==='VALID'?'Configuration valid':'Validation failed')}if(x==='compile'){yamlText=document.querySelector('#yaml').value;S.config='BUILD SUCCESSFUL';render();toast('Build successful')}if(x==='upload'){yamlText=document.querySelector('#yaml').value;S.config='UPLOADING';S.upload=0;render();let id=setInterval(()=>{S.upload+=10;let p=document.querySelector('#prog');if(p)p.style.width=S.upload+'%';if(S.upload>=100){clearInterval(id);S.config='DEVICE ONLINE';render();toast('Firmware uploaded')}},120)}if(x==='copy')navigator.clipboard?.writeText(yamlText).then(()=>toast('YAML copied'));if(x==='packet'){S.packet++;S.packetPos=92;render();setTimeout(()=>{S.packetPos=5;render();toast('ACK received in 38 ms')},650)}if(x==='rangeTest')toast('Extended range test queued: 2.8 km');if(x==='bomSelect'){S.bom=a.dataset.bom;render()}if(x==='bomItem')modal(a.dataset.name,`<p><b>${a.dataset.value}</b></p><p>Prototype-friendly selection; availability, exact SKU and enclosure fit are finalized during build.</p>`);if(x==='bomCsv')download(`${S.bom}-bom.csv`,'category,component\n'+boms[S.bom].map(r=>r.join(',')).join('\n'));if(x==='test'){S.test=a.dataset.test;render()}if(x==='rerun')toast(`${S.test} passed`);if(x==='runAll')toast('Quick suite: 12 passed, 2 in progress');if(x==='delivery'){S.step=+a.dataset.step;render()}if(x==='nextStep'){S.step=S.step===6?1:S.step+1;render()}});
document.addEventListener('change',e=>{if(e.target.id==='freq'){S.freq=e.target.value;toast(`Frequency ${S.freq}`)}if(e.target.id==='sf'){S.sf=e.target.value;toast(`${S.sf} selected`)}if(e.target.id==='bw'){S.bw=e.target.value;toast(`${S.bw} selected`)}});document.addEventListener('input',e=>{if(e.target.id==='threshold')S.threshold=+e.target.value;if(e.target.id==='yaml'){yamlText=e.target.value;S.config='MODIFIED'}});
setInterval(()=>{if(!S.paused){let x=telemetry.at(-1);telemetry.push([new Date().toLocaleTimeString([], {hour12:false}),+(x[1]+(Math.random()-.45)*.08).toFixed(1),+(x[2]+(Math.random()-.55)*.12).toFixed(1),+(x[3]+(Math.random()-.5)*.08).toFixed(1),82,Math.max(-70,Math.min(-45,x[5]+(Math.random()>.5?1:-1)))]);telemetry=telemetry.slice(-24);if(S.route==='telemetry')render()}},2500);render();
</script>
